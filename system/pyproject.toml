[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "assist-engine"
version = "0.1.0"
description = "Core engine for Assist Engine"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]